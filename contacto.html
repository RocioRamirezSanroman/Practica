<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FisioCenter - Contacto</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
</head>
<body>
    <header>
        <div class="container header-container">
            <div class="logo">
                <i class="fas fa-hands-helping"></i>
                <span>FisioCenter</span>
            </div>
            <nav>
                <ul>
                    <li><a href="index.html">Inicio</a></li>
                    <li><a href="servicios.html">Servicios</a></li>
                    <li><a href="nosotros.html">Nosotros</a></li>
                    <li><a href="contacto.html" class="active">Contacto</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <section class="page-header">
        <div class="container">
            <h1>Contacto</h1>
            <p>Estamos aquí para ayudarte</p>
        </div>
    </section>

    <section class="contact">
        <div class="container contact-container">
            <div class="contact-info">
                <h2>Información de contacto</h2>
                <p><i class="fas fa-map-marker-alt"></i> Calle Terapia 123, Ciudad</p>
                <p><i class="fas fa-phone"></i> +34 123 456 789</p>
                <p><i class="fas fa-envelope"></i> info@fisiocenter.com</p>
            </div>
            <div class="contact-form">
                <form>
                    <input type="text" placeholder="Nombre" required>
                    <input type="email" placeholder="Email" required>
                    <textarea placeholder="Tu mensaje" required></textarea>
                    <button type="submit" class="btn">Enviar</button>
                </form>
            </div>
        </div>
    </section>

    <footer>
        <div class="container">
            <p>&copy; 2023 FisioCenter. Todos los derechos reservados.</p>
        </div>
    </footer>
</body>
</html>
